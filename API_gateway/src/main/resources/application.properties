spring.application.name=api-gateway
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
logging.structured.format.console=ecs
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.registry-fetch-interval-seconds=5
app.jwt.secret=${JWT_SECRET:demo-only-change-me-0123456789abcdef0123456789abcdef}

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=25s
