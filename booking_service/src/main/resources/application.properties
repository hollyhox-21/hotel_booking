spring.application.name=booking-service
server.port=${PORT:8081}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
logging.structured.format.console=ecs
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.registry-fetch-interval-seconds=5
spring.datasource.url=jdbc:h2:mem:booking-service;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.order_updates=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
app.jwt.secret=${JWT_SECRET:demo-only-change-me-0123456789abcdef0123456789abcdef}
app.jwt.issuer=hotel-booking
app.seed.enabled=${SEED_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
app.hotel.url=${HOTEL_URL:http://hotel-service}
app.hotel.timeout-ms=1800
app.hotel.retry-attempts=3
app.recovery-delay-ms=5000
app.pending-timeout-seconds=45
