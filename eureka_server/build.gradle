plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.1.0'
}
group = 'org.example'
version = '1.0.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(22) } }
repositories { mavenCentral() }
dependencyManagement { imports { mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.4' } }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-server'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform(); maxHeapSize = '512m' }
spotless { java { googleJavaFormat('1.28.0') } }
