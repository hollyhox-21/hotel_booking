plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.1.0'
}
group = 'org.example'
version = '1.0.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(22) } }
repositories { mavenCentral() }
dependencyManagement { imports { mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.1.4' } }
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test') { useJUnitPlatform(); maxHeapSize = '512m' }
spotless { java { googleJavaFormat('1.28.0') } }
dependencies { implementation project(':common') }
tasks.named('check') { dependsOn ':common:spotlessCheck' }
tasks.named('spotlessApply') { dependsOn ':common:spotlessApply' }
