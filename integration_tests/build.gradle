plugins {
    id 'java'
    id 'application'
    id 'com.diffplug.spotless' version '8.1.0'
}
java { toolchain { languageVersion = JavaLanguageVersion.of(22) } }
repositories { mavenCentral() }
dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
    implementation 'tools.jackson.core:jackson-databind'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
application { mainClass = 'org.example.system.DemoData' }
tasks.named('test') { useJUnitPlatform { excludeTags 'e2e' } }
tasks.register('e2e', Test) {
    description = 'Checks the running application through Gateway.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'e2e' }
    outputs.upToDateWhen { false }
}
spotless { java { googleJavaFormat('1.28.0') } }
